name: Build and Release Version 4

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
      fail-fast: false

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install System Dependencies (Linux)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y libgirepository1.0-dev gcc libcairo2-dev pkg-config python3-dev gir1.2-gtk-3.0
        sudo apt-get install -y gir1.2-webkit2-4.1 || sudo apt-get install -y gir1.2-webkit2-4.0

    - name: Install Python Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pywebview reportlab openpyxl xlrd pyinstaller

    - name: Build Executable (Linux/macOS)
      if: runner.os != 'Windows'
      run: |
        pyinstaller --noconfirm --onedir --windowed \
          --add-data "web:web" \
          --add-data "app_icon.png:." \
          --name AttendanceProcessor \
          main.py

    - name: Build Executable (Windows)
      if: runner.os == 'Windows'
      shell: cmd
      run: pyinstaller --noconfirm --onedir --windowed --add-data "web;web" --add-data "app_icon.png;." --icon app_icon.ico --name AttendanceProcessor main.py

    - name: Create Windows Installer
      if: runner.os == 'Windows'
      run: |
        iscc installer.iss

    - name: Archive Build (Linux/macOS)
      if: runner.os != 'Windows'
      run: |
        cd dist
        tar -czf ../AttendanceProcessor-${{ runner.os }}.tar.gz AttendanceProcessor

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: binaries-${{ runner.os }}
        path: |
          *.tar.gz
          dist/*-Setup.exe
        retention-days: 1

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all workflow run artifacts
        uses: actions/download-artifact@v4
        with:
          path: binaries
          pattern: binaries-*
          merge-multiple: true

      - name: Create or Update Release
        uses: softprops/action-gh-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: V13
          name: Attendance Processor Pro V13
          fail_on_unmatched_files: false
          body: |
            ## 🏫 Attendance Processor Pro V13

            ### What's New
            - 📊 **Salary report** now shows exactly 11 clean columns: Emp Code, Name, Base Salary, Working Days, Days Absent, Total Req Mins, Per Min Rate, Worked Mins, Leave Credit Mins, Payable Mins, Earned
            - 🥪 **Sandwich leave fix** — Leave credit is only granted for genuine absences. Absences adjacent to a Holiday or Weekly Off (sandwich-type) receive **zero** leave credit
            - 🎨 **PDF redesign** — Title on its own line, generated date below it (no overlap), no org name, no formula, no SQL query. Thin horizontal rules, alternating rows, clean navy header bar, auto landscape for wide tables
            - 🪟 **Windows launch fix** — Removed broken icon kwarg; internal exe name kept as AttendanceProcessor for seamless upgrades

            ### Platforms
            - ✅ Windows (Edge WebView2, bundled installer)
            - ✅ macOS (WKWebView, native)
            - ✅ Linux (WebKit2GTK)
          files: |
            binaries/**/*.tar.gz
            binaries/**/*.exe
