name: Build and Release Version 4

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
      fail-fast: false

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install System Dependencies (Linux)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y libgirepository1.0-dev gcc libcairo2-dev pkg-config python3-dev gir1.2-gtk-3.0
        sudo apt-get install -y gir1.2-webkit2-4.1 || sudo apt-get install -y gir1.2-webkit2-4.0

    - name: Install Python Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pywebview reportlab openpyxl xlrd pyinstaller

    - name: Build Executable (Linux/macOS)
      if: runner.os != 'Windows'
      run: |
        pyinstaller --noconfirm --onedir --windowed \
          --add-data "web:web" \
          --add-data "app_icon.png:." \
          --name AttendanceProcessor \
          main.py

    - name: Build Executable (Windows)
      if: runner.os == 'Windows'
      shell: cmd
      run: pyinstaller --noconfirm --onedir --windowed --add-data "web;web" --add-data "app_icon.png;." --icon app_icon.ico --name AttendanceProcessor main.py

    - name: Create Windows Installer
      if: runner.os == 'Windows'
      run: |
        iscc installer.iss

    - name: Archive Build (Linux/macOS)
      if: runner.os != 'Windows'
      run: |
        cd dist
        tar -czf ../AttendanceProcessor-${{ runner.os }}.tar.gz AttendanceProcessor

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: binaries-${{ runner.os }}
        path: |
          *.tar.gz
          dist/*-Setup.exe
        retention-days: 1

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all workflow run artifacts
        uses: actions/download-artifact@v4
        with:
          path: binaries
          pattern: binaries-*
          merge-multiple: true

      - name: Create or Update Release
        uses: softprops/action-gh-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: V17
          name: Attendance Processor Pro V17 (Zenith Edition)
          fail_on_unmatched_files: false
          body: |
            ## 🏫 Attendance Processor Pro V17 (Zenith Edition)

            ### What's New in V17
            - ⚖️ **Mathematical Invariant Conservation** — Guaranteed exact equality across every employee and summary row: `Payable Mins + Deducted Mins ≡ Total Required Minutes` and `Earned Amount + Deducted Amount ≡ Base Monthly Salary`.
            - 🥪 **Contiguous Multi-Day Sandwich Chain Engine** — Traces full contiguous chains of holidays/weekdays adjacent to absences; all absorbed days are visually marked in High-Alert Red (`.status-sandwich`) with dashed borders across tables, previews, and exports.
            - 📊 **Unified Sandwich Absents in Salary & Daily Reports** — All 3 salary reports (This Month, Previous Month, Date Range) and the Employee Wise Info macro total row now accurately include all sandwich-absorbed days in their absent counts without perturbing any financial calculations.
            - ⏱️ **4-Tier Temporal Precedence Engine** — Strict priority cascade: Day-Specific Time Override > Employee Custom Arrival/Departure > Calendar Day Required Times > General Settings.
            - 🎨 **Ultra Dev Mode PDF Engine** — Interactive live PDF preview, column resizing, custom CSS presets (Slate, Minimal, Emerald, Tech, Compact), formula toggle, watermark control, and special schedule notes injection.
            - 🚌 **School Bus Transport Exemption** — Bus employees receive full shift credit with zero late/early deductions.
            - 🤖 **AI Schema Reference Copilot** — One-click auto-copy for AI prompt engineering and SQL macro authoring.

            ### Platforms
            - ✅ Windows (Edge WebView2, bundled installer)
            - ✅ macOS (WKWebView, native)
            - ✅ Linux (WebKit2GTK)
          files: |
            binaries/**/*.tar.gz
            binaries/**/*.exe

