name: Build and Release Version 4

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
      fail-fast: false

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install System Dependencies (Linux)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y libgirepository1.0-dev gcc libcairo2-dev pkg-config python3-dev gir1.2-gtk-3.0
        sudo apt-get install -y gir1.2-webkit2-4.1 || sudo apt-get install -y gir1.2-webkit2-4.0

    - name: Install Python Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pywebview reportlab openpyxl xlrd pyinstaller

    - name: Build Executable (Linux/macOS)
      if: runner.os != 'Windows'
      run: |
        pyinstaller --noconfirm --onedir --windowed \
          --add-data "web:web" \
          --add-data "app_icon.png:." \
          --name AttendancePro \
          main.py

    - name: Build Executable (Windows)
      if: runner.os == 'Windows'
      run: |
        pyinstaller --noconfirm --onedir --windowed \
          --add-data "web;web" \
          --add-data "app_icon.png;." \
          --icon app_icon.ico \
          --name AttendancePro \
          main.py

    - name: Create Windows Installer
      if: runner.os == 'Windows'
      run: |
        iscc installer.iss

    - name: Archive Build (Linux/macOS)
      if: runner.os != 'Windows'
      run: |
        cd dist
        tar -czf ../AttendancePro-${{ runner.os }}.tar.gz AttendancePro

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: binaries-${{ runner.os }}
        path: |
          *.tar.gz
          dist/*-Setup.exe
        retention-days: 1

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all workflow run artifacts
        uses: actions/download-artifact@v4
        with:
          path: binaries
          pattern: binaries-*
          merge-multiple: true

      - name: Create or Update Release
        uses: softprops/action-gh-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: V12
          name: Attendance Processor Pro V12
          fail_on_unmatched_files: false
          body: |
            ## 🏫 Attendance Processor Pro V12

            ### New in V12
            - ⏱ **Minute-rate salary engine** with full sandwich rule (Python-based, no brittle SQL)
            - 🚌 **School bus transport exemption** — bus employees exempt from late/early deductions
            - 📅 **Per-day time overrides** per employee and per calendar date
            - ✔ **Paid/Unpaid Holiday & Weekly Off** toggle in Settings
            - 💰 **This Month / Prev Month / Date Range** salary in Quick Reports (3 buttons, always visible)
            - 🤖 **AI Agent Schema Info** button — instant DB schema + API reference for query writing
            - 🎨 **New minimal PDF design** with navy header, alternating rows, auto landscape
            - 🖼 New app icon (biometric attendance machine)
            - App renamed to **AttendancePro**

            ### Platforms
            - ✅ Windows (Edge WebView2, bundled installer)
            - ✅ macOS (WKWebView, native)
            - ✅ Linux (WebKit2GTK)
          files: |
            binaries/**/*.tar.gz
            binaries/**/*.exe
