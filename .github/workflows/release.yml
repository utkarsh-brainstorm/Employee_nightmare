name: Build and Release Version 4

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
      fail-fast: false

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install System Dependencies (Linux)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y libgirepository1.0-dev gcc libcairo2-dev pkg-config python3-dev gir1.2-gtk-3.0
        sudo apt-get install -y gir1.2-webkit2-4.1 || sudo apt-get install -y gir1.2-webkit2-4.0

    - name: Install Python Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pywebview reportlab openpyxl xlrd pyinstaller

    - name: Build Executable (Linux/macOS)
      if: runner.os != 'Windows'
      run: |
        pyinstaller --noconfirm --onedir --windowed --add-data "web:web" --name AttendanceProcessor main.py

    - name: Build Executable (Windows)
      if: runner.os == 'Windows'
      run: |
        pyinstaller --noconfirm --onedir --windowed --add-data "web;web" --name AttendanceProcessor main.py

    - name: Create Windows Installer
      if: runner.os == 'Windows'
      run: |
        iscc installer.iss

    - name: Archive Build (Linux/macOS)
      if: runner.os != 'Windows'
      run: |
        cd dist
        tar -czf ../AttendanceProcessor-${{ runner.os }}.tar.gz AttendanceProcessor

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: binaries-${{ runner.os }}
        path: |
          *.tar.gz
          dist/*-Setup.exe
        retention-days: 1

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all workflow run artifacts
        uses: actions/download-artifact@v4
        with:
          path: binaries
          pattern: binaries-*
          merge-multiple: true

      - name: Create or Update Release
        uses: softprops/action-gh-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: V11
          name: Attendance Processor V11
          fail_on_unmatched_files: false
          body: |
            **Attendance Processor V11**
            
            - Strict Minute-Rate Salary Computation
            - Custom Employee Schedules
            - Paid Leave Credit logic
            - Portrait PDF Exports
            We've transitioned from legacy Tkinter to a lightning-fast PyWebView single-page application built with modern web technologies.
            
            - Cross-platform Native WebViews (WKWebView, EdgeWebView2, WebKit2GTK)
            - Fully autonomous SQL-based reporting macro system
            - Smart Excel attendance parsing and dynamic salary computation
          files: |
            binaries/**/*.tar.gz
            binaries/**/*.exe
