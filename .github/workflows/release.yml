name: Build and Release Version 4

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
      fail-fast: false

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install System Dependencies (Linux)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y libgirepository1.0-dev gcc libcairo2-dev pkg-config python3-dev gir1.2-gtk-3.0
        sudo apt-get install -y gir1.2-webkit2-4.1 || sudo apt-get install -y gir1.2-webkit2-4.0

    - name: Install Python Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pywebview reportlab openpyxl xlrd pyinstaller

    - name: Build Executable (Linux/macOS)
      if: runner.os != 'Windows'
      run: |
        pyinstaller --noconfirm --onedir --windowed \
          --add-data "web:web" \
          --add-data "app_icon.png:." \
          --name AttendanceProcessor \
          main.py

    - name: Build Executable (Windows)
      if: runner.os == 'Windows'
      shell: cmd
      run: pyinstaller --noconfirm --onedir --windowed --add-data "web;web" --add-data "app_icon.png;." --icon app_icon.ico --name AttendanceProcessor main.py

    - name: Create Windows Installer
      if: runner.os == 'Windows'
      run: |
        iscc installer.iss

    - name: Archive Build (Linux/macOS)
      if: runner.os != 'Windows'
      run: |
        cd dist
        tar -czf ../AttendanceProcessor-${{ runner.os }}.tar.gz AttendanceProcessor

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: binaries-${{ runner.os }}
        path: |
          *.tar.gz
          dist/*-Setup.exe
        retention-days: 1

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all workflow run artifacts
        uses: actions/download-artifact@v4
        with:
          path: binaries
          pattern: binaries-*
          merge-multiple: true

      - name: Create or Update Release
        uses: softprops/action-gh-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: V14
          name: Attendance Processor Pro V14
          fail_on_unmatched_files: false
          body: |
            ## 🏫 Attendance Processor Pro V14

            ### What's New
            - 🗄️ **Live DB recompute** — Saving a calendar day (holiday/weekly-off/day-specific times) now instantly updates `req_in`, `req_out`, `is_late`, `left_early`, and `status` for ALL employees on that date in the database
            - 👤 **Employee save triggers recompute** — Changing an employee's arrival, departure, or transport flag instantly recalculates all their attendance flags across the entire database
            - 📅 **Day override triggers recompute** — Setting a per-day override for an employee updates exactly that one (emp_code, date) row immediately
            - 📥 **Import triggers recompute** — After importing an Excel file, all newly imported employees' flags are recomputed against current calendar and settings
            - 🆕 **`req_in` / `req_out` columns** added to `attendance_raw` — stores the resolved required time per row (priority chain: day override > employee default > calendar day > global)
            - 💰 **Salary: Paid Holiday Mins** — new column showing minutes from paid holidays/weekly-offs that were NOT absorbed into a sandwich deduction
            - 📉 **Salary: Deducted Mins** — shows `X (absent) + Y (late/early)` so you can see exactly what was docked
            - ✅ Payable Mins now correctly = Worked + Paid Holiday + Leave Credit
            - 🥪 Leave credit = 0 for employees with zero absences; sandwich absences never get credit

            ### Platforms
            - ✅ Windows (Edge WebView2, bundled installer)
            - ✅ macOS (WKWebView, native)
            - ✅ Linux (WebKit2GTK)
          files: |
            binaries/**/*.tar.gz
            binaries/**/*.exe

